<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>软云 IoT 设备控制及数据可视化系统</title>
  <style>
    .menu-group { color: #d5dde8; cursor: pointer; }
    
    .menu-group.active { background: rgba(255, 255, 255, .05); color: #fff; border-left-color: transparent; }
    
    .submenu { display: block; }
    
    .submenu.closed { display: none; }
    
    .app.collapsed .submenu { display: none !important; }
    
    .stat-card {
          min-height: 108px;
          padding: 18px 20px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
          gap: 12px;
          background: #fff;
          border: 1px solid #ebeef5;
          border-radius: var(--radius);
          box-shadow: 0 1px 2px rgba(0,0,0,.03);
          text-align: left;
        }
    
    .stat-card h3 { margin: 0; font-weight: 400; color: #606266; font-size: 14px; }
    
    .status-stack { padding: 18px 16px; display: grid; gap: 18px; }
    
    .status-row {
          display: grid;
          grid-template-columns: 70px minmax(150px, 1fr) 36px;
          gap: 14px;
          align-items: center;
          min-height: 18px;
          color: #606266;
          font-size: 13px;
        }
    
    .trend-grid { display: grid; gap: 12px; }
    
    .trend-panel { padding-bottom: 14px; }
    
    .trend-body {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 210px;
          gap: 14px;
          align-items: stretch;
          padding: 14px 16px 16px;
        }
    
    .trend-chart { position: relative; min-height: 290px; }
    
    .trend-legend {
          display: flex;
          flex-wrap: wrap;
          gap: 14px;
          align-items: center;
          margin-bottom: 8px;
          color: #606266;
          font-size: 12px;
        }
    
    .trend-legend span { display: inline-flex; align-items: center; gap: 6px; }
    
    .trend-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    
    .trend-stage { position: relative; height: 260px; overflow: visible; }
    
    .trend-svg { width: 100%; height: 260px; overflow: visible; display: block; }
    
    .trend-axis { fill: #8b97a6; font-size: 12px; }
    
    .trend-axis-line { stroke: #dfe6ef; stroke-width: 1; }
    
    .trend-grid-line { stroke: #edf1f6; stroke-width: 1; }
    
    .trend-series { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    
    .trend-point { cursor: pointer; }
    
    .trend-point.hit { fill: transparent; stroke: transparent; pointer-events: all; }
    
    .trend-point.dot { stroke: #fff; stroke-width: 2; pointer-events: none; }
    
    .trend-tooltip {
          position: absolute;
          min-width: 132px;
          padding: 10px 12px;
          border-radius: 4px;
          background: rgba(255,255,255,.98);
          border: 1px solid #dbe4ef;
          box-shadow: 0 4px 14px rgba(0,0,0,.08);
          font-size: 12px;
          color: #303133;
          pointer-events: none;
          transform: translate(-50%, -100%);
          z-index: 2;
        }
    
    .trend-tooltip.below { transform: translate(-50%, 12px); }
    
    .trend-tooltip.below::after {
          top: -6px;
          bottom: auto;
          border-right: 0;
          border-bottom: 0;
          border-left: 1px solid #dbe4ef;
          border-top: 1px solid #dbe4ef;
        }
    
    .trend-tooltip b { display: block; margin-top: 4px; font-size: 15px; color: #1e8f7a; }
    
    .trend-tooltip small { color: #909399; }
    
    .trend-tooltip div { display: grid; gap: 4px; margin-top: 6px; color: #606266; }
    
    .trend-tooltip::after {
          content: "";
          position: absolute;
          left: 50%;
          bottom: -6px;
          width: 10px;
          height: 10px;
          background: #fff;
          border-right: 1px solid #dbe4ef;
          border-bottom: 1px solid #dbe4ef;
          transform: translateX(-50%) rotate(45deg);
        }
    
    .trend-meta {
          display: grid;
          gap: 12px;
          align-content: start;
        }
    
    .trend-item {
          min-height: 78px;
          border: 1px solid #ebeef5;
          border-radius: var(--radius);
          background: #fafbfd;
          padding: 12px 14px;
          display: grid;
          gap: 6px;
        }
    
    .trend-item span { color: #909399; font-size: 12px; }
    
    .trend-item strong { font-size: 26px; font-weight: 500; color: #303133; line-height: 1; }
    
    .trend-note { color: #67c23a; font-size: 12px; }
    
    .map-body svg, .china-map-image { width: 100%; height: 100%; display: block; }
    
    .china-map-stage {
          position: relative;
          height: 100%;
          aspect-ratio: 774 / 569;
          max-width: 100%;
        }
    
    .china-map-pin {
          position: absolute;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          transform: translate(-50%, -50%);
          color: #5f6b7a;
          font-size: 12px;
          line-height: 1;
          white-space: nowrap;
          pointer-events: none;
        }
    
    .china-map-pin i {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #1e8f7a;
          box-shadow: 0 0 0 6px rgba(30, 143, 122, 0.12);
          flex: none;
        }
    
    .china-map-pin em {
          font-style: normal;
          padding: 3px 7px;
          border: 1px solid #dce7f3;
          background: rgba(255, 255, 255, 0.92);
          border-radius: 10px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
    
    .map-shell { position: relative; height: 268px; background: linear-gradient(#fff, #fbfdff); overflow: hidden; }
    
    .map-toolbar {
          position: absolute;
          right: 12px;
          top: 12px;
          z-index: 2;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
    
    .map-toolbar button {
          width: 28px;
          height: 28px;
          border: 1px solid #d9e2ef;
          background: rgba(255,255,255,.96);
          color: #606266;
          border-radius: 4px;
          box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
    
    .map-viewport {
          position: absolute;
          inset: 0;
          overflow: hidden;
          cursor: grab;
          touch-action: none;
        }
    
    .map-viewport.dragging { cursor: grabbing; }
    
    .map-canvas {
          width: 100%;
          height: 100%;
          display: grid;
          place-items: center;
          transform-origin: 50% 50%;
          will-change: transform;
          user-select: none;
          pointer-events: none;
        }
    
    .map-canvas .china-map-stage {
          position: relative;
          width: 100%;
          height: 100%;
          max-width: 100%;
        }
    
    .china-map-stage .china-map-image {
          object-fit: contain;
        }
    
    .map-hint {
          position: absolute;
          left: 14px;
          bottom: 12px;
          z-index: 2;
          font-size: 12px;
          color: #909399;
          background: rgba(255,255,255,.9);
          border: 1px solid #e4ebf5;
          border-radius: 4px;
          padding: 4px 8px;
        }
    
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
    
    .device-board { display: block; }
    
    .device-board-body {
          display: grid;
          grid-template-columns: 280px minmax(0, 1fr);
          gap: 20px;
          align-items: stretch;
        }
    
    .device-board-status { display: grid; gap: 12px; }
    
    .device-board-chart {
          border: 1px solid #ebeef5;
          border-radius: var(--radius);
          background: #fff;
          padding: 16px 18px;
        }
    
    .device-status-chip {
          min-height: 56px;
          border: 1px solid #ebeef5;
          border-radius: var(--radius);
          background: #fafbfd;
          display: grid;
          grid-template-columns: auto 1fr auto;
          align-items: center;
          gap: 10px;
          padding: 0 14px;
        }
    
    .device-status-chip span { color: #606266; }
    
    .device-status-chip b { font-size: 24px; font-weight: 500; color: #303133; }
    
    .chart-body.compact { height: 228px; padding: 6px 0 0; display: block; }
    
    .category-filter-panel { padding: 14px 14px 10px; }
    
    .category-filter-row {
          display: flex;
          align-items: center;
          flex-wrap: wrap;
          gap: 8px 8px;
        }
    
    .category-filter-item {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin: 0;
          flex: 0 0 auto;
        }
    
    .category-filter-item label {
          width: 56px;
          text-align: right;
          color: #606266;
          white-space: nowrap;
          flex: none;
        }
    
    .category-filter-item input,
        .category-filter-item select {
          width: 148px;
          height: 32px;
          border: 1px solid #dcdfe6;
          border-radius: var(--radius);
          padding: 0 10px;
          background: #fff;
          outline: none;
        }
    
    .category-filter-actions {
          display: flex;
          align-items: center;
          gap: 0;
          margin-left: 2px;
          flex: 0 0 auto;
        }
    
    .category-filter-actions .btn {
          min-width: 60px;
          height: 32px;
          padding: 0 12px;
        }
    
    .category-filter-actions .btn + .btn { margin-left: -1px; }
    
    .category-filter-actions .btn:first-child {
          border-top-right-radius: 0;
          border-bottom-right-radius: 0;
        }
    
    .category-filter-actions .btn:last-child {
          border-top-left-radius: 0;
          border-bottom-left-radius: 0;
        }
    
    .drawer.wide { width: min(1000px, calc(100vw - 60px)); }

    .drawer.category-editor-drawer { width: min(680px, calc(100vw - 60px)); }

    .category-editor-drawer .drawer-body {
          padding: 18px 20px 6px;
          background: #fff;
        }

    .category-editor-form {
          display: grid;
          gap: 0;
        }

    .category-editor-form .form-line {
          grid-template-columns: 104px minmax(0, 1fr);
          align-items: start;
          margin-bottom: 16px;
        }

    .category-editor-form .form-line label {
          min-height: 32px;
          display: flex;
          align-items: center;
          justify-content: flex-end;
          color: #606266;
        }

    .category-editor-form .form-line label.required::before {
          content: "*";
          color: #f56c6c;
          margin-right: 4px;
        }

    .category-editor-form .form-line input,
        .category-editor-form .form-line select,
        .category-editor-form .form-line textarea {
          width: 100%;
          box-sizing: border-box;
        }

    .category-logo-field {
          min-height: 68px;
          display: flex;
          align-items: center;
          gap: 12px;
          min-width: 0;
        }

    .category-logo-preview {

          border: 1px solid #d9ecff;
          border-radius: 4px;
          display: grid;
          place-items: center;

          background: #f4fbf9;

          font-weight: 600;
        }

    .category-logo-meta {
          display: grid;

          min-width: 0;

        }

    .category-logo-meta strong {

          text-overflow: ellipsis;

          color: #303133;
          font-weight: 500;
        }

    .category-logo-meta span {
          color: #909399;

          line-height: 1.4;
        }

    .category-radio-group {
          min-height: 32px;
          display: flex;
          align-items: center;
          gap: 18px;
        }

    .category-radio-option {
          display: inline-flex;
          align-items: center;
          gap: 6px;

        }

    .category-editor-form .category-radio-option input {

          height: 14px;
          padding: 0;
          flex: 0 0 auto;
        }

    .category-guide-editor {
          border: 1px solid #dcdfe6;
          border-radius: var(--radius);
          overflow: hidden;
          background: #fff;
        }

    .category-guide-toolbar {
          height: 34px;
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 0 8px;
          border-bottom: 1px solid #ebeef5;
          background: #fafbfd;
        }

    .category-guide-toolbar button {
          width: 28px;
          min-width: 28px;
          height: 28px;
          padding: 0;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border: 0;
          border-radius: 4px;
          background: transparent;
          color: #52647a;
        }

    .category-guide-toolbar button:hover {
          color: var(--blue);
          background: rgba(45, 101, 214, .08);
        }

    .category-guide-editor textarea {
          display: block;
          min-height: 108px;
          height: 108px;
          border: 0 !important;
          resize: vertical;
          border-radius: 0;
          padding: 10px 12px;
        }

    .category-source-page {
          min-height: calc(100vh - 86px);
          margin: -12px -12px -16px;
          padding: 0 0 24px;

        }

    .category-source-head {
          min-height: 54px;

    .category-source-back {

    .category-source-sep {

    .category-source-summary {

    .category-source-summary div {

    .category-source-summary span,
        .category-source-label {

    .category-source-summary strong,

    .category-source-tabs {
          display: flex;

    .category-source-tabs button {

          font-weight: 500;
        }

    .category-source-tabs button:first-child {
          margin-left: 0;
        }

    .category-source-tabs button.active {
          color: #409eff;
          background: #fff;

    .category-source-tabs button.active::after {
          content: "";

          left: 0;
          right: 0;
          bottom: -1px;

          background: #fff;
        }

    .category-source-body {
          padding: 32px 30px;
        }

    .category-source-section {
          padding-bottom: 34px;
          border-bottom: 1px solid #dcdfe6;
        }

    .category-source-section + .category-source-section {

        }

    .category-source-section:last-child {

        }

    .category-source-desc-grid {
          display: grid;
          grid-template-columns: minmax(145px, 1fr) minmax(145px, 1fr) minmax(220px, 1.15fr);
          gap: 22px 24px;

        }

    .category-source-desc-grid div,
        .category-source-label-row {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          gap: 10px;
          align-items: center;
        }

    .category-source-tags {
          display: inline-flex;
          flex-wrap: wrap;

          align-items: center;
        }

    .category-source-tag {

    .category-source-edit-link {

        }

    .category-label-modal .modal-body {
          padding: 16px 20px;
        }

    .category-label-modal .data-table {
          min-width: 0;
        }

    @media (max-width: 900px) {
          .category-source-desc-grid { grid-template-columns: 1fr; }
          .category-source-page { margin: -12px -12px -16px; }
        }

    function stopLoginStars() {

    function setupLoginStars() {
      stopLoginStars();
      const canvas = document.getElementById("iotLoginStars");
      if (!canvas || typeof canvas.getContext !== "function") return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      let rafId = 0;
      let disposed = false;
      let width = 0;
      let height = 0;
      let stars = [];
      const rand = (min, max) => min + Math.random() * (max - min);
      const createStars = () => {
        const count = Math.max(74, Math.min(118, Math.round((width * height) / 15500)));
        stars = Array.from({ length: count }, () => ({
          x: rand(0, width || window.innerWidth || 1440),
          y: rand(0, height || window.innerHeight || 820),
          vx: rand(-0.16, 0.16) || 0.08,
          vy: rand(-0.12, 0.12) || -0.06,
          r: rand(1.1, 2.45),
          alpha: rand(0.28, 0.72),
          phase: rand(0, Math.PI * 2)
        }));
      };
      const resize = () => {
        const rect = canvas.getBoundingClientRect();
        width = Math.max(1, rect.width || window.innerWidth || 1440);
        height = Math.max(1, rect.height || window.innerHeight || 820);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        createStars();
      };
      const draw = time => {
        if (disposed || !document.body.contains(canvas)) return;
        ctx.clearRect(0, 0, width, height);
        const maxDistance = Math.max(118, Math.min(166, width * 0.12));

        for (let i = 0; i < stars.length; i += 1) {
          const a = stars[i];
          a.x += a.vx;
          a.y += a.vy;
          if (a.x < -8) a.x = width + 8;
          if (a.x > width + 8) a.x = -8;
          if (a.y < -8) a.y = height + 8;
          if (a.y > height + 8) a.y = -8;
          for (let j = i + 1; j < stars.length; j += 1) {
            const b = stars[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const distance = Math.hypot(dx, dy);
            if (distance < maxDistance) {
              const alpha = (1 - distance / maxDistance) * 0.16;
              ctx.strokeStyle = `rgba(104, 171, 235, ${alpha})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        for (const star of stars) {
          const pulse = 0.7 + Math.sin(time / 700 + star.phase) * 0.3;
          const glow = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.r * 5.5);
          glow.addColorStop(0, `rgba(141, 203, 255, ${star.alpha * pulse})`);
          glow.addColorStop(1, "rgba(141, 203, 255, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r * 5.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(224, 244, 255, ${Math.min(0.9, star.alpha + 0.12)})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
        }

        rafId = window.requestAnimationFrame(draw);
      };

      resize();
      window.addEventListener("resize", resize);
      rafId = window.requestAnimationFrame(draw);
      window.__iotLoginStarsStop = () => {
        disposed = true;
        window.cancelAnimationFrame(rafId);
        window.removeEventListener("resize", resize);
        ctx.clearRect(0, 0, width, height);
      };
    }

    function groupTreeHtml() {
      const toNode = item => ({
        id: item.id,
        title: item.groupName,
        desc: item.groupDesc || "",
        children: state.groups.filter(child => String(child.parentId) === String(item.id)).map(toNode)
      });
      const rootGroups = state.groups.filter(item => !item.parentId || String(item.parentId) === "0" || String(item.parentId) === "all");
      const nodes = [{ id: "all", title: "全部分组", children: rootGroups.map(toNode) }];
      const keyword = groupTreeKeyword();
      const matchesKeyword = node => !keyword || [node.title, node.desc, node.id].some(value => String(value || "").toLowerCase().includes(keyword));
      const filterNode = node => {
        const children = (node.children || []).map(filterNode).filter(Boolean);
        if (node.id === "all") return { ...node, children };
        return matchesKeyword(node) ? node : children.length ? { ...node, children } : null;
      };
      const visibleNodes = nodes.map(filterNode).filter(Boolean);
      const renderNode = (node, depth = 0) => `<button class="tree-node ${state.groupTreeId === node.id ? "active" : ""}" data-action="groupTree" data-tree-id="${node.id}" style="padding-left:${12 + depth * 14}px">${node.title}</button>${node.children ? node.children.map(child => renderNode(child, depth + 1)).join("") : ""}`;
      const treeHtml = visibleNodes.map(node => renderNode(node)).join("");
      return treeHtml + (keyword && !visibleNodes[0]?.children?.length ? `<div class="tree-empty">暂无匹配分组</div>` : "");
    }

    function handleProfileAvatarFile(file) {
      if (!file) return;
      const type = String(file.type || "").toLowerCase();
      const name = String(file.name || "");
      const lowerName = name.toLowerCase();
      const validType = type === "image/jpeg" || type === "image/png" || /\.(jpe?g|png)$/.test(lowerName);
      if (!validType) {
        state.modalData = { ...(state.modalData || {}), fileName: name, fileSizeText: profileAvatarFileSizeText(file.size), error: "只能上传 jpg/png 用户头像" };
        render();
        return;
      }
      if (Number(file.size || 0) > 500 * 1024) {
        state.modalData = { ...(state.modalData || {}), fileName: name, fileSizeText: profileAvatarFileSizeText(file.size), error: "头像大小不能超过 500kb" };
        render();
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const user = currentProfileUser();
        state.modalData = {
          ...(state.modalData || {}),
          avatarName: name,
          avatarText: profileAvatarText(user),
          avatarUploaded: true,
          avatarVersion: Number(user?.avatarVersion || 0) + 1,
          avatarUrl: String(reader.result || ""),
          fileName: name,
          fileSizeText: profileAvatarFileSizeText(file.size),
          error: ""
        };
        render();
        showToast("头像已选择，确认后生效");
      };
      reader.onerror = () => {
        state.modalData = { ...(state.modalData || {}), fileName: name, fileSizeText: profileAvatarFileSizeText(file.size), error: "图片读取失败，请重新选择" };

    function handleCategoryLogoFile(file) {
      if (state.editor?.kind !== "category" || !file) return;
      syncCategoryEditor();
      const type = String(file.type || "").toLowerCase();
      const name = String(file.name || "");
      const lowerName = name.toLowerCase();
      const validType = type === "image/jpeg" || type === "image/png" || /\.(jpe?g|png)$/.test(lowerName);
      if (!validType) {
        showToast("仅支持 jpg / png 图标");
        return;
      }
      if (Number(file.size || 0) > 500 * 1024) {
        showToast("图标大小不能超过 500kb");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        state.editor.data.logo = name;
        state.editor.data.logoUrl = String(reader.result || "");
        state.editor.data.logoSizeText = profileAvatarFileSizeText(file.size);
        render();
        showToast("图标已选择，保存后生效");
      };
      reader.onerror = () => showToast("图片读取失败，请重新选择");
      reader.readAsDataURL(file);

    function loginSubmit(ev) {
      ev?.preventDefault();

      const passwordInput = document.getElementById("loginPassword");
      const setLoginError = (input, errorId, message) => {
        input?.closest(".iot-field")?.querySelector(".iot-input-wrap, .iot-password-wrap")?.classList.add("is-error");
        if (input) input.setAttribute("aria-invalid", "true");
        const error = document.getElementById(errorId);
        if (error) {
          error.textContent = message;
          error.classList.add("visible");
        }
      };
      document.querySelectorAll(".iot-input-wrap.is-error, .iot-password-wrap.is-error").forEach(el => el.classList.remove("is-error"));
      document.querySelectorAll(".iot-login-error.visible").forEach(el => {
        el.textContent = "";
        el.classList.remove("visible");
      });
      [tenantInput, usernameInput, passwordInput].forEach(input => input?.removeAttribute("aria-invalid"));
      if (!String(usernameInput?.value || "").trim()) {
        setLoginError(usernameInput, "loginUsernameError", "请输入用户名");
        usernameInput?.focus();
        return;
      }
      if (!String(passwordInput?.value || "")) {
        setLoginError(passwordInput, "loginPasswordError", "请输入密码");
        passwordInput?.focus();
        return;
      }
      if (String(passwordInput?.value || "").length < 5) {
        setLoginError(passwordInput, "loginPasswordError", "密码长度最少为5位");

        return;
